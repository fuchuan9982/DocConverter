name: Build DocConverter Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app.py'
      - 'requirements.txt'
      - '.github/workflows/windows-build.yml'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install LibreOffice
        shell: pwsh
        run: |
          choco install libreoffice-fresh -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'LibreOffice installation failed' }

      - name: Build portable Windows application
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --name DocConverter app.py
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller build failed' }
          if (!(Test-Path 'dist/DocConverter/DocConverter.exe')) { throw 'DocConverter.exe not found' }

          $libreOffice = "${env:ProgramFiles}\LibreOffice"
          if (!(Test-Path "$libreOffice\program\soffice.exe")) {
            $libreOffice = "${env:ProgramFiles(x86)}\LibreOffice"
          }
          if (!(Test-Path "$libreOffice\program\soffice.exe")) { throw 'Bundled soffice.exe not found' }
          Copy-Item -Recurse -Force "$libreOffice" 'dist/DocConverter/LibreOffice'

      - name: Verify executable
        shell: pwsh
        run: |
          if (!(Test-Path 'dist/DocConverter/DocConverter.exe')) { throw 'Executable missing' }
          if (!(Test-Path 'dist/DocConverter/LibreOffice/program/soffice.exe')) { throw 'LibreOffice runtime missing' }

      - name: Zip portable application
        shell: pwsh
        run: Compress-Archive -Path 'dist/DocConverter/*' -DestinationPath 'DocConverter-Windows-x64.zip' -Force

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: DocConverter-Windows-x64
          path: DocConverter-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
